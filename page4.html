<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC | Enroll Now</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg');
            background-size: cover;
            background-repeat: no-repeat;
        }

        nav {
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        #formbox {
            background-color: #ffffffee;
            padding: 40px;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            margin: auto;
        }

        h1 {
            font-family: Catamaran;
            font-weight: 900;
            color: #024A85;
            text-align: center;
        }

        p {
            text-align: center;
            font-size: 18px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            color: #024A85;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .btn-custom {
            margin-top: 25px;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #8cb7dac5;">
        <div class="container-fluid">
            <a class="navbar-brand" href="page2.html"><img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/e01fd0f1-eda0-443b-ab56-74f748469f01/Header.png" alt="obmclogo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                 <li class="nav-item">
                    <a class="nav-link" href=index.html">Home</a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="page2.html">Courses Offer</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page3.html">Contact Us</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page4.html">Enroll Now</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page5.html">About the Group Member</a>
                </li>
            </ul>

            <form class="d-flex">
                <input class="form-control me-2" type="text" placeholder="Search">
                <button class="btn btn-info" type="button">Search</button>
            </form>
        </div>
        </div>
    </nav>

    <br><br>

    <div id="formbox">
        <h1>Enroll Now</h1>
        <p>Begin your journey with O.B. Montessori Center</p>

        <form>
            <label>First Name</label>
                <input type="text" placeholder="Enter first name">

            <label>Last Name</label>
                <input type="text" placeholder="Enter last name">

            <label>Birth Date</label>
                <input type="date">

            <label>Gender</label>
                <select>
                    <option>Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>

            <label>Grade Level</label>
                <select>
                    <option>Select level</option>
                    <option>Casa</option>
                    <option>Primary</option>
                    <option>Intermediate</option>
                    <option>Junior High School</option>
                    <option>Senior High School</option>
                </select>

            <label>Preferred Campus</label>
                <select>
                    <option>Select campus</option>
                    <option>Angeles</option>
                    <option>Fairview</option>
                    <option>Greenhills</option>
                    <option>Las Piñas</option>
                    <option>Sta. Ana</option>
                </select>

            <label>Email Address</label>
                <input type="email" placeholder="Enter email">

            <label>Contact Number</label>
                <input type="number" placeholder="Enter contact number">

            <label>Mode of Learning</label>
                <select>
                    <option>Select mode</option>
                    <option>Online</option>
                    <option>Onsite</option>
                    <option>Hybrid</option>
                </select>

            <button class="btn btn-success w-100 btn-custom">Submit Enrollment</button>
            <button type="reset" class="btn btn-secondary w-100 btn-custom">Reset</button>
        </form>
    </div>

    <br><br>
</body>
</html>
